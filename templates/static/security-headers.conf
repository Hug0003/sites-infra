# En-têtes de sécurité. Le HSTS est ajouté par l'Apache de 192.168.11.131 (terminaison HTTPS).
# CSP : n'autoriser que les domaines réellement utilisés par le site (à adapter par repo).
add_header Content-Security-Policy "__CSP__" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "__PERMISSIONS__" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
