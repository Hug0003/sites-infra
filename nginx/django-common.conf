# Partagé par les deux applis Django (inclus dans nginx/<appli>.conf, bloc server).
listen 8080;
server_name _;
server_tokens off;
absolute_redirect off;
client_max_body_size 5m;

# Les connexions arrivent de l'Apache (192.168.11.131) : on récupère la vraie IP
# du visiteur pour que la limitation de débit s'applique par personne.
set_real_ip_from 192.168.11.131;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

location /static/ {
    alias /static/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=604800" always;
}

# Images envoyées par les utilisateurs : jamais exécutées ni interprétées comme une page.
location /media/ {
    alias /media/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    location ~* \.(html?|svg|xml|js|php|py|sh)$ {
        return 403;
    }
}

location ~ /\. {
    return 404;
}

location / {
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Fourni par l'Apache (https) : indispensable pour les cookies sécurisés et le CSRF de Django.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

# Connexion, inscription et connexion à l'admin (…/login/, quel que soit DJANGO_ADMIN_PATH) :
# 10 requêtes par minute et par visiteur.
location ~ ^/(login|signup)/|/login/$ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}
