# Reverse proxy 192.168.11.131 → conteneurs de 192.168.11.134.
# Un seul site public : hugomeuriel.fr. Les projets sont sous hugomeuriel.fr/projets/<nom>/,
# les anciens sous-domaines (natours.hugomeuriel.fr…) redirigent vers ces chemins.
#
# Installation (voir README) :
#   sudo cp apache/security.conf /etc/apache2/conf-available/hugomeuriel-security.conf
#   sudo cp apache/hugomeuriel-sites.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo a2enconf hugomeuriel-security && sudo a2ensite hugomeuriel-sites
#   sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d hugomeuriel.fr -d www.hugomeuriel.fr
# certbot crée la version *:443 de chaque vhost (fichier -le-ssl.conf) et la redirection http → https.

<VirtualHost *:80>
    ServerName hugomeuriel.fr
    ServerAlias www.hugomeuriel.fr

    # www → domaine principal
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://hugomeuriel.fr%{REQUEST_URI} [R=301,L]

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 30
    # Valeur imposée par l'Apache, jamais celle envoyée par le visiteur.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # HSTS : le navigateur n'utilisera plus jamais http:// pour ce domaine (ignoré en http).
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always unset X-Powered-By

    # /projets/natours → /projets/natours/ (sinon les chemins relatifs du site cassent)
    RedirectMatch 301 ^/projets/(guessmynumber|icecream|natours|nexter|trillo|robot|sunorcloud|crushbrito|pizzamama)$ /projets/$1/

    # Projets : les plus précis d'abord, le portfolio (/) en dernier.
    ProxyPass        /projets/guessmynumber/ http://192.168.11.134:8102/
    ProxyPassReverse /projets/guessmynumber/ http://192.168.11.134:8102/
    ProxyPass        /projets/icecream/      http://192.168.11.134:8103/
    ProxyPassReverse /projets/icecream/      http://192.168.11.134:8103/
    ProxyPass        /projets/natours/       http://192.168.11.134:8104/
    ProxyPassReverse /projets/natours/       http://192.168.11.134:8104/
    ProxyPass        /projets/nexter/        http://192.168.11.134:8105/
    ProxyPassReverse /projets/nexter/        http://192.168.11.134:8105/
    ProxyPass        /projets/trillo/        http://192.168.11.134:8106/
    ProxyPassReverse /projets/trillo/        http://192.168.11.134:8106/
    ProxyPass        /projets/robot/         http://192.168.11.134:8107/
    ProxyPassReverse /projets/robot/         http://192.168.11.134:8107/
    ProxyPass        /projets/sunorcloud/    http://192.168.11.134:8108/
    ProxyPassReverse /projets/sunorcloud/    http://192.168.11.134:8108/
    ProxyPass        /projets/crushbrito/    http://192.168.11.134:8111/
    ProxyPassReverse /projets/crushbrito/    http://192.168.11.134:8111/
    ProxyPass        /projets/pizzamama/     http://192.168.11.134:8112/
    ProxyPassReverse /projets/pizzamama/     http://192.168.11.134:8112/

    ProxyPass        / http://192.168.11.134:8101/
    ProxyPassReverse / http://192.168.11.134:8101/

    ErrorLog ${APACHE_LOG_DIR}/hugomeuriel-error.log
    CustomLog ${APACHE_LOG_DIR}/hugomeuriel-access.log combined
</VirtualHost>

# Anciens sous-domaines → hugomeuriel.fr/projets/<nom>/ (garde les liens existants et le référencement).
# Facultatif : nécessite que leurs DNS pointent ici et un certificat (certbot -d natours.hugomeuriel.fr …).
<VirtualHost *:80>
    ServerName guessmynumber.hugomeuriel.fr
    ServerAlias www.guessmynumber.hugomeuriel.fr icecream.hugomeuriel.fr www.icecream.hugomeuriel.fr
    ServerAlias natours.hugomeuriel.fr www.natours.hugomeuriel.fr nexter.hugomeuriel.fr www.nexter.hugomeuriel.fr
    ServerAlias trillo.hugomeuriel.fr www.trillo.hugomeuriel.fr robot.hugomeuriel.fr www.robot.hugomeuriel.fr
    ServerAlias sunorcloud.hugomeuriel.fr www.sunorcloud.hugomeuriel.fr crushbrito.hugomeuriel.fr www.crushbrito.hugomeuriel.fr
    ServerAlias pizzamama.hugomeuriel.fr www.pizzamama.hugomeuriel.fr

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^(?:www\.)?([a-z]+)\.hugomeuriel\.fr$ [NC]
    RewriteRule ^ https://hugomeuriel.fr/projets/%1/ [R=301,L]
</VirtualHost>

# Toute autre adresse (IP brute, domaine inconnu) : refusée. Doit être le premier vhost chargé :
# nommer le fichier 000-default.conf ou désactiver celui de Debian (a2dissite 000-default).
