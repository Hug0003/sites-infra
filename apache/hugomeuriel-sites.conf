# Reverse proxy 192.168.11.131 → conteneur hugomeuriel de 192.168.11.134:8101 (même modèle que deva2.fr).
# Un seul site public : hugomeuriel.fr. Les projets sont sous hugomeuriel.fr/projets/<nom>/,
# les anciens sous-domaines (natours.hugomeuriel.fr…) redirigent vers ces chemins.
#
# Installation sur .131 :
#   sudo cp apache/hugomeuriel-sites.conf /etc/apache2/sites-available/hugomeuriel.fr.conf
#   sudo a2enmod headers          # proxy, proxy_http et rewrite sont déjà actifs pour deva2
#   sudo a2ensite hugomeuriel.fr && sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d hugomeuriel.fr -d www.hugomeuriel.fr
# certbot ajoute la redirection http → https ici et crée hugomeuriel.fr-le-ssl.conf (*:443).

<VirtualHost *:80>
    ServerName hugomeuriel.fr
    ServerAlias www.hugomeuriel.fr

    # Let's Encrypt : le challenge est servi par Apache lui-même, pas envoyé au serveur .134
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    # www → domaine principal (sauf le challenge Let's Encrypt)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://hugomeuriel.fr%{REQUEST_URI} [R=301,L]

    ProxyPreserveHost On
    ProxyTimeout 30
    # Valeur imposée par l'Apache, jamais celle envoyée par le visiteur :
    # Django s'en sert pour savoir que la connexion est en HTTPS (cookies sécurisés, CSRF).
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # HSTS : le navigateur n'utilisera plus jamais http:// pour ce domaine (ignoré en http).
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always unset X-Powered-By

    # Tout le site (portfolio et /projets/<nom>/) est dans un seul conteneur sur .134:8101.
    ProxyPass        / http://192.168.11.134:8101/
    ProxyPassReverse / http://192.168.11.134:8101/

    ErrorLog  ${APACHE_LOG_DIR}/hugomeuriel.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/hugomeuriel.fr-access.log combined
</VirtualHost>

# Anciens sous-domaines → hugomeuriel.fr/projets/<nom>/ (garde les liens existants et le référencement).
# Facultatif : nécessite que leurs DNS pointent ici, puis
#   sudo certbot --apache -d natours.hugomeuriel.fr -d www.natours.hugomeuriel.fr …
<VirtualHost *:80>
    ServerName guessmynumber.hugomeuriel.fr
    ServerAlias www.guessmynumber.hugomeuriel.fr icecream.hugomeuriel.fr www.icecream.hugomeuriel.fr
    ServerAlias natours.hugomeuriel.fr www.natours.hugomeuriel.fr nexter.hugomeuriel.fr www.nexter.hugomeuriel.fr
    ServerAlias trillo.hugomeuriel.fr www.trillo.hugomeuriel.fr robot.hugomeuriel.fr www.robot.hugomeuriel.fr
    ServerAlias sunorcloud.hugomeuriel.fr www.sunorcloud.hugomeuriel.fr crushbrito.hugomeuriel.fr www.crushbrito.hugomeuriel.fr
    ServerAlias pizzamama.hugomeuriel.fr www.pizzamama.hugomeuriel.fr

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{HTTP_HOST} ^(?:www\.)?([a-z]+)\.hugomeuriel\.fr$ [NC]
    RewriteRule ^ https://hugomeuriel.fr/projets/%1/ [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/hugomeuriel.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/hugomeuriel.fr-access.log combined
</VirtualHost>
