# Durcissement global d'Apache (192.168.11.131).
# sudo cp apache/security.conf /etc/apache2/conf-available/hugomeuriel-security.conf && sudo a2enconf hugomeuriel-security

# Ne pas annoncer la version d'Apache ni du système.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Protège contre les connexions lentes qui monopolisent les processus (attaque « slowloris »).
<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# TLS moderne uniquement (appliqué aux vhosts *:443 créés par certbot).
<IfModule ssl_module>
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionTickets off
</IfModule>
