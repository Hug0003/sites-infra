# Premier vhost chargé = vhost par défaut : toute requête dont le domaine n'est pas
# hugomeuriel.fr (scan par IP, domaine inconnu) reçoit 403 au lieu d'un des sites.
# sudo cp apache/000-default.conf /etc/apache2/sites-available/000-default.conf
<VirtualHost *:80>
    ServerName default.invalid
    <Location />
        Require all denied
    </Location>
</VirtualHost>
