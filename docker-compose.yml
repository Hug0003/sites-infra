# Tous les sites de hugomeuriel.fr, sur 192.168.11.134 (dossier /opt/sites).
# Un seul site public : hugomeuriel.fr. Les projets sont servis sous hugomeuriel.fr/projets/<nom>/
# par l'Apache de 192.168.11.131, qui envoie chaque chemin vers le port indiqué.
# Mise à jour automatique : sites-update.timer lance update.sh toutes les 2 minutes.
#
# Port  Chemin                    Repo GitHub
# 8101  /                         hugomeuriel-portfolio
# 8102  /projets/guessmynumber/   guess-my-number
# 8103  /projets/icecream/        glace
# 8104  /projets/natours/         travel
# 8105  /projets/nexter/          reservation-hotels
# 8106  /projets/trillo/          agence-de-voyage
# 8107  /projets/robot/           robot
# 8108  /projets/sunorcloud/      apiMeteo
# 8111  /projets/crushbrito/      crushbrito
# 8112  /projets/pizzamama/       Pizzeria
#
# Les ports n'écoutent que sur l'adresse du serveur dans le réseau de l'ami (HOST_IP),
# jamais sur une autre interface.

# Serveur partagé avec deva2 : préfixe propre pour les conteneurs, réseaux et volumes.
name: hugomeuriel

x-hardening: &hardening
  restart: unless-stopped
  # Système de fichiers en lecture seule, aucun privilège : un site compromis ne peut ni
  # modifier son code, ni installer d'outil, ni gagner de droits sur le serveur.
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m"]
  pids_limit: 100
  mem_limit: 128m
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

x-static: &static
  <<: *hardening

services:
  # ---------- Sites statiques ----------
  portfolio:
    <<: *static
    image: ghcr.io/hug0003/site-portfolio:latest
    ports: ["${HOST_IP:-192.168.11.134}:8101:8080"]

  guessmynumber:
    <<: *static
    image: ghcr.io/hug0003/site-guessmynumber:latest
    ports: ["${HOST_IP:-192.168.11.134}:8102:8080"]

  icecream:
    <<: *static
    image: ghcr.io/hug0003/site-icecream:latest
    ports: ["${HOST_IP:-192.168.11.134}:8103:8080"]

  natours:
    <<: *static
    image: ghcr.io/hug0003/site-natours:latest
    ports: ["${HOST_IP:-192.168.11.134}:8104:8080"]

  nexter:
    <<: *static
    image: ghcr.io/hug0003/site-nexter:latest
    ports: ["${HOST_IP:-192.168.11.134}:8105:8080"]

  trillo:
    <<: *static
    image: ghcr.io/hug0003/site-trillo:latest
    ports: ["${HOST_IP:-192.168.11.134}:8106:8080"]

  robot:
    <<: *static
    image: ghcr.io/hug0003/site-robot:latest
    ports: ["${HOST_IP:-192.168.11.134}:8107:8080"]

  # Météo : Nginx relaie les API et y ajoute les clés (env/sunorcloud.env).
  sunorcloud:
    <<: *static
    image: ghcr.io/hug0003/site-sunorcloud:latest
    env_file: env/sunorcloud.env
    ports: ["${HOST_IP:-192.168.11.134}:8108:8080"]

  # ---------- Django : crushbrito ----------
  crushbrito:
    <<: *hardening
    image: ghcr.io/hug0003/site-crushbrito:latest
    mem_limit: 384m
    env_file: env/crushbrito.env
    environment:
      WSGI_APP: osculte.wsgi:application
      DJANGO_ALLOWED_HOSTS: hugomeuriel.fr
      DJANGO_SCRIPT_NAME: /projets/crushbrito
    volumes:
      - ./data/crushbrito:/data          # db.sqlite3 + media/
      - crushbrito_static:/static
    networks: [crushbrito]

  crushbrito-web:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on: [crushbrito]
    ports: ["${HOST_IP:-192.168.11.134}:8111:8080"]
    volumes:
      - ./nginx/crushbrito.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/django-common.conf:/etc/nginx/django-common.conf:ro
      - ./data/crushbrito/media:/media:ro
      - crushbrito_static:/static:ro
    networks: [crushbrito]

  # ---------- Django : pizzamama ----------
  pizzamama:
    <<: *hardening
    image: ghcr.io/hug0003/site-pizzamama:latest
    mem_limit: 384m
    env_file: env/pizzamama.env
    environment:
      WSGI_APP: pizzeria.wsgi:application
      DJANGO_ALLOWED_HOSTS: hugomeuriel.fr
      DJANGO_SCRIPT_NAME: /projets/pizzamama
    volumes:
      - ./data/pizzamama:/data
      - pizzamama_static:/static
    networks: [pizzamama]

  pizzamama-web:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on: [pizzamama]
    ports: ["${HOST_IP:-192.168.11.134}:8112:8080"]
    volumes:
      - ./nginx/pizzamama.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/django-common.conf:/etc/nginx/django-common.conf:ro
      - ./data/pizzamama/media:/media:ro
      - pizzamama_static:/static:ro
    networks: [pizzamama]

# Chaque appli Django a son propre réseau : un conteneur compromis ne voit pas les autres.
networks:
  crushbrito:
  pizzamama:

volumes:
  crushbrito_static:
  pizzamama_static:
