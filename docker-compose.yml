# hugomeuriel.fr sur 192.168.11.134 (dossier /opt/hugo-portfolio) : UN seul conteneur.
# Portfolio et tous les projets (hugomeuriel.fr/projets/<nom>/) sont dans l'image construite par
# le repo hugomeuriel-portfolio. L'Apache de 192.168.11.131 envoie tout le domaine vers le port 8101.
# Déployé par le workflow .github/workflows/deploy.yml (VPN + SSH) : rien n'est cloné sur le serveur.

# Serveur partagé avec deva2 : préfixe propre pour le conteneur, le réseau et les volumes.
name: hugomeuriel

services:
  site:
    image: ghcr.io/hug0003/hugomeuriel:latest
    restart: unless-stopped
    # N'écoute que sur l'adresse du serveur dans le réseau local, jamais sur Internet.
    ports: ["${HOST_IP:-192.168.11.134}:8101:8080"]
    volumes:
      - ./data:/data          # bases SQLite et images envoyées de crushbrito et pizzamama
      - ./env:/env:ro         # secrets (écrits par le workflow depuis les secrets GitHub)
    # Système de fichiers en lecture seule, aucun privilège : un site compromis ne peut ni
    # modifier son code, ni installer d'outil, ni gagner de droits sur le serveur.
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
